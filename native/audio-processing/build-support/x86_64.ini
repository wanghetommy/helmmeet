[binaries]
c = ['clang', '-arch', 'x86_64']
cpp = ['clang++', '-arch', 'x86_64']
ar = 'ar'
strip = 'strip'

[host_machine]
system = 'darwin'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
needs_exe_wrapper = true

[built-in options]
c_args = ['-mmacosx-version-min=14.0', '-fvisibility=hidden', '-ffunction-sections', '-fdata-sections']
cpp_args = ['-mmacosx-version-min=14.0', '-fvisibility=hidden', '-ffunction-sections', '-fdata-sections']
c_link_args = ['-arch', 'x86_64', '-mmacosx-version-min=14.0']
cpp_link_args = ['-arch', 'x86_64', '-mmacosx-version-min=14.0', '-framework', 'CoreFoundation']
