[package]
name = "helmmeet-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["audio-processing"]
audio-processing = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
swift-rs = { version = "1.0.7", features = ["build"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
meeting-core = { path = "../../../crates/meeting-core" }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
base64 = "0.23"
tokio = { version = "1", features = ["time"] }
sha2 = "0.10"
whisper-rs = { version = "=0.16.0" }
rfd = "0.15"
url = "2"
libc = "0.2"

tempfile = "=3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
whisper-rs = { version = "=0.16.0", features = ["metal"] }

[dev-dependencies]
serde_json = "1"
